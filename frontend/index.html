<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>visualiser.cloud — Audio-Reactive Visual Experiences</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Styles -->
    <link href="/index.css" rel="stylesheet" />

    <!-- SEO -->
    <meta
      name="description"
      content="visualiser.cloud is an audio-reactive visual platform transforming sound into immersive, real-time generative visuals."
    />
    <meta
      name="keywords"
      content="audio visualizer, generative art, real-time visuals, music visualization, creative coding, WebGL, Three.js"
    />
    <meta name="author" content="visualiser.cloud" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="visualiser.cloud" />
    <meta
      property="og:description"
      content="Transform sound into immersive, real-time visual experiences."
    />
    <meta property="og:url" content="https://visualiser.cloud" />
    <meta property="og:image" content="https://visualiser.cloud/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="visualiser.cloud" />
    <meta
      name="twitter:description"
      content="Immersive audio-reactive visuals in real time."
    />
    <meta
      name="twitter:image"
      content="https://visualiser.cloud/og-image.jpg"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0b0e11" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
